name: Build RAFAEL CLOUDSTREAM APK

on:
  workflow_dispatch:
  push:
    branches:
      - rafael-branding-v1
    paths:
      - "app/**"
      - "shared/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-rafael.yml"

permissions:
  contents: read

concurrency:
  group: rafael-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build stable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFAEL-CLOUDSTREAM-stable-release
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 14
