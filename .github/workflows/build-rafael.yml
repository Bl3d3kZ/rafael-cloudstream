name: Build RAFAEL CLOUDSTREAM APK

on:
  workflow_dispatch:
  push:
    branches:
      - rafael-branding-v1
    paths:
      - "app/**"
      - "shared/**"
      - "library/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-rafael.yml"

permissions:
  contents: read

concurrency:
  group: rafael-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build stable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFAEL-CLOUDSTREAM-stable-release
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 14
